<html lang="ko">
<head>
<meta charset="UTF-8">

<style>
:root{
  --blue:#1a3a5c;--blue-mid:#2d5f8a;--blue-light:#e8f2fb;
  --accent:#0ea5e9;--green:#16a34a;--green-light:#f0fdf4;
  --red:#dc2626;--gold:#d97706;--gold-light:#fffbeb;
  --gray50:#f8fafc;--gray100:#f1f5f9;--gray200:#e2e8f0;
  --gray300:#cbd5e1;--gray500:#64748b;--gray700:#374151;--gray900:#0f172a;
  --white:#fff;--radius:12px;--shadow:0 2px 16px rgba(26,58,92,.10);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;background:var(--gray50);color:var(--gray900);min-height:100vh;padding:12px 12px calc(80px + var(--safe-b)) 12px;-webkit-font-smoothing:antialiased;}
.app{max-width:620px;margin:0 auto}
.hdr{text-align:center;padding:20px 0 16px;border-bottom:1px solid var(--gray200);margin-bottom:20px}
.hdr-ico{font-size:32px;display:block;margin-bottom:6px}
.hdr h1{font-size:18px;font-weight:700;color:var(--blue);letter-spacing:-.3px}
.hdr p{font-size:12px;color:var(--gray500);margin-top:3px}
.prg-wrap{margin-bottom:20px}
.prg-dots{display:flex;gap:6px;margin-bottom:8px}
.prg-dot{flex:1;height:4px;border-radius:2px;background:var(--gray200);transition:background .3s}
.prg-dot.done{background:var(--blue)}.prg-dot.active{background:var(--accent)}
.prg-lbl{display:flex;justify-content:space-between;align-items:center}
.prg-title{font-size:14px;font-weight:700;color:var(--blue)}
.prg-cnt{font-size:12px;color:var(--gray500)}
.card{background:var(--white);border:1px solid var(--gray200);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.ct{font-size:12px;font-weight:700;color:var(--gray500);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--gray700);margin-bottom:5px}
.field input{width:100%;padding:11px 12px;border:1.5px solid var(--gray200);border-radius:8px;font-size:16px;color:var(--gray900);background:var(--white);outline:none;transition:border-color .2s;-webkit-appearance:none;}
.field input:focus{border-color:var(--accent)}
.field .hint{font-size:11px;color:var(--gray500);margin-top:4px}
.unit-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.unit-btn{padding:7px 14px;border:1.5px solid var(--gray200);border-radius:20px;background:var(--white);font-size:13px;font-weight:600;color:var(--gray500);cursor:pointer;transition:all .2s;min-height:36px;}
.unit-btn.sel{border-color:var(--blue);background:var(--blue-light);color:var(--blue)}
.area-row{display:flex;gap:8px;align-items:center}
.area-row input{flex:1;padding:11px 12px;border:1.5px solid var(--gray200);border-radius:8px;font-size:18px;font-weight:700;color:var(--gray900);outline:none;-webkit-appearance:none}
.area-row input:focus{border-color:var(--accent)}
.area-unit-lbl{font-size:14px;color:var(--gray500);white-space:nowrap;font-weight:600;min-width:28px}
.area-conv{font-size:11px;color:var(--blue-mid);margin-top:5px;font-weight:600}
.gsd-wrap{padding:2px 0}
.gsd-top{display:flex;gap:10px;align-items:flex-end;margin-bottom:10px}
.gsd-inp{width:84px;padding:8px;border:1.5px solid var(--accent);border-radius:8px;font-size:22px;font-weight:900;color:var(--accent);text-align:center;outline:none;-webkit-appearance:none;}
.gsd-inp:focus{border-color:var(--blue)}
.gsd-cm{font-size:14px;font-weight:700;color:var(--gray500);padding-bottom:10px}
.gsd-name{flex:1;padding-bottom:6px}
.gsd-name-main{font-size:15px;font-weight:700;color:var(--blue)}
.gsd-name-sub{font-size:11px;color:var(--gray500);margin-top:2px}
input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:var(--gray200);outline:none;cursor:pointer;width:100%;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--blue);cursor:pointer;border:3px solid var(--white);box-shadow:0 2px 6px rgba(26,58,92,.3);}
.gsd-ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--gray500);margin-top:4px}
.gsd-q{margin-top:10px;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600;text-align:center}
.gsd-q.hi{background:#eff6ff;color:#1d4ed8}.gsd-q.mid{background:var(--green-light);color:var(--green)}.gsd-q.lo{background:#fef9c3;color:#a16207}
.opt-grid{display:grid;gap:7px}
.opt-grid.c3{grid-template-columns:1fr 1fr 1fr}
.opt-btn{padding:10px 6px;border:1.5px solid var(--gray200);border-radius:8px;background:var(--white);font-size:11px;font-weight:600;color:var(--gray700);cursor:pointer;text-align:center;transition:all .2s;line-height:1.4;min-height:44px;}
.opt-btn.sel{border-color:var(--blue);background:var(--blue-light);color:var(--blue)}
.opt-btn .ob-main{display:block;font-size:12px;font-weight:700}
.opt-btn .ob-sub{display:block;font-size:9px;color:var(--gray500);margin-top:2px;white-space:normal;line-height:1.3}
.opt-btn.sel .ob-sub{color:var(--blue-mid)}
.out-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.out-card{border:1.5px solid var(--gray200);border-radius:10px;padding:12px 8px;cursor:pointer;transition:all .2s;text-align:center;position:relative;min-height:100px;}
.out-card.sel{border-color:var(--blue);background:var(--blue-light)}
.out-card input[type=checkbox]{position:absolute;top:7px;right:7px;width:15px;height:15px;accent-color:var(--blue)}
.out-card .oi{font-size:24px;display:block;margin-bottom:5px}
.out-card .on{font-size:12px;font-weight:700;color:var(--gray700)}
.out-card.sel .on{color:var(--blue)}
.out-card .od{font-size:9px;color:var(--gray500);margin-top:3px;line-height:1.4}
.eq-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.eq-grid.c3{grid-template-columns:1fr 1fr 1fr}
.eq-btn{padding:10px 6px;border:1.5px solid var(--gray200);border-radius:8px;background:var(--white);cursor:pointer;text-align:center;transition:all .2s;min-height:70px;}
.eq-btn.sel{border-color:var(--blue);background:var(--blue-light)}
.eq-btn .ei{font-size:18px;display:block;margin-bottom:3px}
.eq-btn .en{font-size:11px;font-weight:700;color:var(--gray700);display:block}
.eq-btn.sel .en{color:var(--blue)}
.eq-btn .es{font-size:9px;color:var(--gray500);display:block;margin-top:2px;line-height:1.3}
.tip-wrap{display:inline-block;position:relative;cursor:pointer}
.tip-ico{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--gray200);color:var(--gray500);font-size:9px;font-weight:700;margin-left:3px;vertical-align:middle;}
.tip-pop{display:none;position:fixed;bottom:90px;left:12px;right:12px;background:var(--gray900);color:var(--white);font-size:12px;line-height:1.6;padding:14px 16px;border-radius:12px;z-index:9000;white-space:normal;font-weight:400;box-shadow:0 8px 32px rgba(0,0,0,.4);}
.tip-pop.show{display:block}
.proc-row{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--gray100);transition:opacity .2s}
.proc-row:last-child{border-bottom:none}
.proc-row.off{opacity:.35}
.proc-toggle{flex-shrink:0;margin-top:3px;width:40px;height:22px;border-radius:11px;background:var(--gray300);border:none;cursor:pointer;position:relative;transition:background .2s;-webkit-appearance:none;}
.proc-toggle.on{background:var(--blue)}
.proc-toggle::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--white);transition:left .2s;}
.proc-toggle.on::after{left:21px}
.proc-body{flex:1;min-width:0}
.proc-name{font-size:13px;font-weight:600;color:var(--gray700);display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.proc-row.off .proc-name{color:var(--gray500)}
.proc-detail{font-size:11px;color:var(--gray500);margin-top:3px;line-height:1.5;word-break:keep-all}
.proc-amt{font-size:13px;font-weight:700;color:var(--gray900);white-space:nowrap;padding-top:3px;flex-shrink:0}
.proc-row.off .proc-amt{color:var(--gray300)}
.sum-box{background:var(--blue-light);border:1px solid #bfdbfe;border-radius:8px;padding:12px 14px;margin-top:12px}
.sum-box-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;gap:8px}
.sum-box-row:last-child{margin-bottom:0;font-weight:700;font-size:14px;color:var(--blue);padding-top:8px;border-top:1px solid #bfdbfe}
.km2-box{background:var(--gray50);border:1px solid var(--gray200);border-radius:8px;padding:10px 14px;margin-bottom:12px}
.km2-box-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:4px}
.km2-box-row:last-child{margin-bottom:0;font-weight:700;font-size:14px;color:var(--blue);padding-top:6px;border-top:1px solid var(--gray200)}
.km2-box-row .kl{color:var(--gray500)}
.km2-box-row .kv{font-weight:600}
.badge-large{display:inline-block;background:#fef3c7;border:1px solid #fbbf24;color:#92400e;font-size:11px;font-weight:700;padding:3px 8px;border-radius:12px;margin-left:6px;vertical-align:middle}
.badge-small{display:inline-block;background:#dcfce7;border:1px solid #86efac;color:#166534;font-size:11px;font-weight:700;padding:3px 8px;border-radius:12px;margin-left:6px;vertical-align:middle}
.rt{width:100%;border-collapse:collapse}
.rt tr{border-bottom:1px solid var(--gray100)}
.rt tr:last-child{border-bottom:none}
.rt td{padding:9px 0;font-size:13px}
.rt td:first-child{color:var(--gray500);padding-right:8px}
.rt td:last-child{text-align:right;font-weight:600;white-space:nowrap}
.rt .tot td{font-size:14px;font-weight:700;border-top:2px solid var(--gray200);padding-top:12px}
.sv-hero{background:linear-gradient(135deg,var(--blue) 0%,var(--blue-mid) 100%);border-radius:var(--radius);padding:24px 16px;color:var(--white);text-align:center;margin-bottom:12px;}
.sv-lbl{font-size:12px;opacity:.8;margin-bottom:5px}
.sv-amt{font-size:36px;font-weight:900;letter-spacing:-1px;margin-bottom:4px}
.sv-rate{font-size:17px;font-weight:700;opacity:.9}
.sv-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.sv-card{background:rgba(255,255,255,.12);border-radius:8px;padding:12px;text-align:center}
.sv-card .sc-l{font-size:10px;opacity:.75;margin-bottom:3px}
.sv-card .sc-v{font-size:18px;font-weight:700}
.ci{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--gray100)}
.ci:last-child{border-bottom:none}
.ci-ico{font-size:20px;flex-shrink:0;width:28px;text-align:center}
.ci-info{flex:1;min-width:0}
.ci-info .cn{font-size:13px;font-weight:600;color:var(--gray700)}
.ci-info .cd{font-size:10px;color:var(--gray500);margin-top:1px}
.ci-inp-w{display:flex;align-items:center;gap:4px;flex-shrink:0}
.ci-inp{width:100px;padding:7px 8px;border:1.5px solid var(--gray200);border-radius:8px;font-size:14px;text-align:right;outline:none;-webkit-appearance:none;}
.ci-inp:focus{border-color:var(--accent)}
.ci-unit{font-size:10px;color:var(--gray500);white-space:nowrap}
.ci-total{background:var(--gray100);border-radius:8px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin-top:12px;}
.ci-total .ctl{font-size:12px;color:var(--gray500)}
.ci-total .ctv{font-size:18px;font-weight:800;color:var(--blue)}
.dep-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--gray100)}
.dep-row:last-child{border-bottom:none}
.dep-ico{font-size:18px;width:26px;text-align:center;flex-shrink:0}
.dep-info{flex:1;min-width:0}
.dep-name{font-size:12px;font-weight:600;color:var(--gray700)}
.dep-sub{font-size:10px;color:var(--gray500);margin-top:1px}
.dep-inp-w{display:flex;align-items:center;gap:4px;flex-shrink:0}
.dep-inp{width:95px;padding:6px 7px;border:1.5px solid var(--gray200);border-radius:6px;font-size:13px;text-align:right;outline:none;-webkit-appearance:none;}
.dep-inp:focus{border-color:var(--accent)}
.dep-unit{font-size:10px;color:var(--gray500);white-space:nowrap}
.dep-total{background:var(--gray100);border-radius:8px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.dep-total .dl{font-size:12px;color:var(--gray500)}
.dep-total .dv{font-size:17px;font-weight:800;color:var(--blue)}
.info-box{background:var(--blue-light);border:1px solid #bfdbfe;border-radius:8px;padding:11px 13px;font-size:12px;color:var(--blue-mid);line-height:1.6;margin-bottom:10px}
.warn-box{background:var(--gold-light);border:1px solid #fde68a;border-radius:8px;padding:11px 13px;font-size:12px;color:var(--gold);line-height:1.6}
.save-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;background:var(--green);color:var(--white);border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:10px;min-height:48px;}
.ex-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ex-btn{padding:14px 10px;border:1.5px solid var(--gray200);border-radius:var(--radius);background:var(--white);cursor:pointer;text-align:center;transition:all .2s;color:var(--gray700);min-height:80px;}
.ex-btn:active{border-color:var(--accent);background:var(--blue-light);color:var(--blue)}
.ex-btn .ei2{font-size:26px;display:block;margin-bottom:5px}
.ex-btn .et{font-size:13px;font-weight:700;display:block}
.ex-btn .ed{font-size:10px;color:var(--gray500);display:block;margin-top:2px}
.copy-area{background:var(--gray50);border:1px solid var(--gray200);border-radius:8px;padding:14px;font-size:12px;color:var(--gray700);line-height:1.8;white-space:pre-wrap;margin-top:10px;max-height:220px;overflow-y:auto;}
.copy-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;background:var(--blue);color:var(--white);border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:10px;min-height:48px;}
.hi-empty{text-align:center;padding:28px;color:var(--gray500);font-size:13px}
.hi-item{border:1px solid var(--gray200);border-radius:8px;padding:12px;margin-bottom:8px}
.hi-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.hi-name{font-size:13px;font-weight:700;color:var(--gray900)}
.hi-date{font-size:11px;color:var(--gray500)}
.hi-sv{font-size:17px;font-weight:800;color:var(--green)}
.hi-meta{font-size:11px;color:var(--gray500);display:flex;gap:10px;flex-wrap:wrap;margin-top:3px}
.hi-del{background:none;border:none;color:var(--gray300);cursor:pointer;font-size:18px;padding:0 4px;min-width:32px;min-height:32px}
.ann-sum{background:var(--green-light);border:1px solid #bbf7d0;border-radius:8px;padding:14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.ann-lbl{font-size:12px;color:var(--green)}
.ann-val{font-size:22px;font-weight:900;color:var(--green)}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:12px 16px calc(12px + var(--safe-b));background:var(--white);border-top:1px solid var(--gray200);box-shadow:0 -4px 16px rgba(0,0,0,.08);z-index:100;}
.btn-p{padding:12px 20px;border:1.5px solid var(--gray200);border-radius:10px;background:var(--white);font-size:14px;font-weight:600;color:var(--gray500);cursor:pointer;min-height:48px;min-width:90px;}
.btn-p:disabled{opacity:.35;cursor:not-allowed}
.btn-n{padding:12px 28px;border:none;border-radius:10px;background:var(--blue);color:var(--white);font-size:14px;font-weight:700;cursor:pointer;min-height:48px;min-width:120px;}
.btn-n:active{opacity:.85}
.hidden{display:none!important}
.toast{position:fixed;bottom:calc(80px + var(--safe-b));left:50%;transform:translateX(-50%) translateY(30px);opacity:0;background:var(--gray900);color:var(--white);padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:9999;transition:transform .25s,opacity .25s;white-space:nowrap;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media(min-width:480px){
  body{padding:20px 20px 100px}
  .card{padding:20px}
  .hdr h1{font-size:20px}
  .sv-amt{font-size:40px}
  .nav{padding:14px 24px calc(14px + var(--safe-b))}
}
.plan-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px}
.plan-tbl{width:100%;border-collapse:collapse;font-size:12px;min-width:460px}
.plan-tbl th{background:var(--gray100);color:var(--gray500);font-weight:700;padding:8px 6px;text-align:left;border-bottom:2px solid var(--gray200);white-space:nowrap}
.plan-tbl td{padding:9px 6px;border-bottom:1px solid var(--gray100);vertical-align:middle}
.plan-tbl tr:last-child td{border-bottom:none}
.plan-tbl .td-name{font-weight:600;color:var(--gray900)}
.plan-tbl .td-date{font-size:10px;color:var(--gray500);margin-top:2px}
.plan-tbl .td-sv{font-weight:700;color:var(--green);white-space:nowrap}
.plan-tbl .td-rt{color:var(--blue);font-weight:600;white-space:nowrap}
.plan-tbl .td-del{text-align:center}
.plan-tbl .tot-row td{background:var(--green-light);font-weight:700;font-size:13px;border-top:2px solid #86efac;border-bottom:none}
.plan-tbl .tot-row .td-sv{font-size:15px;color:var(--green)}
.plan-hint{font-size:11px;color:var(--gray500);margin-top:8px;line-height:1.6}
.ps-wrap{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:4px}
.ps-btn{display:inline-flex;align-items:center;gap:5px;padding:8px 13px;border:1.5px solid var(--gray200);border-radius:20px;background:var(--white);font-size:12px;font-weight:600;color:var(--gray700);cursor:pointer;transition:all .2s;min-height:36px}
.ps-btn:active{background:var(--blue-light);border-color:var(--blue)}
.ps-del-ico{font-size:13px;color:var(--gray300);margin-left:2px;line-height:1}
.ps-add{border-style:dashed;color:var(--blue);border-color:var(--blue);background:var(--blue-light)}
.ps-inp-row{display:flex;gap:6px;align-items:center;margin-top:10px}
.ps-inp{flex:1;padding:10px 12px;border:1.5px solid var(--accent);border-radius:8px;font-size:15px;outline:none;-webkit-appearance:none}
.ps-ok{padding:10px 16px;background:var(--blue);color:var(--white);border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;min-height:44px}
.ps-cancel{padding:10px 12px;background:var(--white);color:var(--gray500);border:1.5px solid var(--gray200);border-radius:8px;font-size:13px;cursor:pointer;min-height:44px}
.share-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;background:var(--blue-mid);color:var(--white);border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;min-height:48px}
.share-btn:active{opacity:.85}
.url-banner{background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:10px 14px;font-size:12px;color:#9a3412;margin-bottom:12px;line-height:1.6}
</style>

/* ===== 공유 URL ===== */
var _fromUrl=false;

function loadFromUrl(){
  if(!location.search) return;
  var p=new URLSearchParams(location.search);
  if(!p.has('ar')) return;
  _fromUrl=true;
  var nm=p.get('nm'); if(nm) S.pName=decodeURIComponent(nm);
  var ar=parseFloat(p.get('ar')); if(ar>0) S.area=ar;
  var au=p.get('au'); if(au&&UNIT_TO_KM2[au]) S.aUnit=au;
  var gs=parseFloat(p.get('gs')); if(gs>0) S.gsd=gs;
  var ti=parseInt(p.get('tr')||'0');
  if(ti>=0&&ti<TERRAINS.length) S.terrain=TERRAINS[ti];
  var o=p.get('o')||'100';
  S.outputs={map2d:o[0]==='1', mesh3d:o.length>1&&o[1]==='1', lidar:o.length>2&&o[2]==='1'};
  var dr=p.get('dr'); if(dr) S.drone=dr;
  var sw=p.get('sw'); if(sw) S.sw=sw;
  var dy=parseInt(p.get('dy')); if(dy>0) S.days=dy;
}

function makeShareUrl(){
  var base=location.href.split('?')[0];
  var parts=[];
  if(S.pName) parts.push('nm='+encodeURIComponent(S.pName));
  parts.push('ar='+S.area);
  parts.push('au='+S.aUnit);
  parts.push('gs='+S.gsd);
  var ti=TERRAINS.indexOf(S.terrain);
  parts.push('tr='+(ti>=0?ti:0));
  parts.push('o='+(S.outputs.map2d?'1':'0')+(S.outputs.mesh3d?'1':'0')+(S.outputs.lidar?'1':'0'));
  parts.push('dr='+S.drone);
  parts.push('sw='+S.sw);
  parts.push('dy='+S.days);
  return base+'?'+parts.join('&');
}

function doShareUrl(){
  gaEvent('share_url',{area:S.area,gsd:S.gsd,terrain:S.terrain});
  var url=makeShareUrl();
  if(navigator.clipboard){
    navigator.clipboard.writeText(url).then(function(){
      toast('공유 URL이 복사되었습니다 — 카카오톡에 붙여넣기 하세요');
    });
  } else {
    var el=document.createElement('input');
    el.value=url; el.style.position='fixed'; el.style.opacity='0';
    document.body.appendChild(el);
    el.select(); document.execCommand('copy');
    document.body.removeChild(el);
    toast('공유 URL이 복사되었습니다');
  }
}

  if(u==='ha')  return +(k/0.01).toFixed(4);
  return k;
}
function areaConvHint(v,u){
  var k=toKm2(v,u);
  if(u==='km2') return '= '+Math.round(k*1000000).toLocaleString()+'m\u00B2 / '+Math.round(k*302500).toLocaleString()+'\ud3c9';
  if(u==='m2')  return '= '+(k).toFixed(6)+'km\u00B2 / '+Math.round(parseFloat(v)/3.3058).toLocaleString()+'\ud3c9';
  if(u==='py')  return '= '+(k).toFixed(6)+'km\u00B2 / '+Math.round(parseFloat(v)*3.3058).toLocaleString()+'m\u00B2';
  if(u==='ha')  return '= '+(k).toFixed(4)+'km\u00B2 / '+Math.round(k*302500).toLocaleString()+'\ud3c9';
  return '';
}

/* ===== GSD ===== */
/* GSD 계수: GSD 5cm = 1.0(기준), 표준품셈 원문 기반 선형 보간 */
/* v=2cm→1.12, v=5cm→1.0, v=10cm→0.80, v=15cm→0.60(하한 0.5) */
function gsdCoef(v){v=parseFloat(v)||5;return Math.max(.5,Math.round((-0.04*v+1.2)*100)/100);}
function gsdLbl(v){v=parseFloat(v);return v<1?'\ucd08\ucd08\uc815\ubc00':v<=2?'\ucd08\uc815\ubc00':v<=4?'\uace0\ud654\uc9c8':v<=6?'\ud45c\uc900':v<=9?'\uc800\ud654\uc9c8':v<=15?'\uad11\uc5ed':'\ucd08\uad11\uc5ed';}
function gsdSub(v){v=parseFloat(v);return v<1?'LiDAR\uae09 (\uc5f0\uad6c\u00b7\ubb38\ud654\uc7ac)':v<=2?'\uc815\ubc00 \uce21\ub7c9\u00b7\uc9c0\uc801\ub3c4 \uc81c\uc791':v<=4?'\uac74\ubb3c\u00b7\ub3c4\ub85c \ud655\uc778':v<=6?'\uc77c\ubc18 \ud604\ud669 \ud30c\uc545':v<=9?'\uad11\uc5ed \ud604\ud669 \ud30c\uc545':'\ub300\uaddc\ubaa8 \uac1c\ub7b5 \ud30c\uc545';}
function gsdQcls(v){v=parseFloat(v);return v<=3?'hi':v<=7?'mid':'lo';}
function gsdQtxt(v){v=parseFloat(v);
  if(v<1)  return '&#128269; '+v+'cm \u2014 LiDAR\uae09 \uc9c0\uc810\ub3c4\u00b7\ubb38\ud654\uc7ac \uac83\ub7ec\uc5d0 \uc0ac\uc6a9';
  if(v<=3) return '&#128269; '+v+'cm \u2014 \uc815\ubc00 \uce21\ub7c9 \uad8c\uc7a5 \uc218\uc900';
  if(v<=6) return '&#9989; '+v+'cm \u2014 \ud45c\uc900 \ud604\ud669 \ud30c\uc545\uc6a9 (\ube44\uc6a9\u00b7\ud488\uc9c8 \uade0\ud615 \ucd5c\uc801)';
  if(v<=10)return '&#128204; '+v+'cm \u2014 \uad11\uc5ed \ud604\ud669 \ud30c\uc545\uc6a9';
  return '&#128506; '+v+'cm \u2014 \ub300\uaddc\ubaa8 \uac1c\ub7b5 \ud30c\uc545\uc6a9';
}

/* ===== 드론/SW 객체 ===== */
function droneObj(v){for(var i=0;i<DRONES.length;i++){if(DRONES[i].v===v)return DRONES[i];}return DRONES[0];}
function swObj(v){for(var i=0;i<SWLIST.length;i++){if(SWLIST[i].v===v)return SWLIST[i];}return SWLIST[0];}
function defCost(id){
  if(id==='maint') return droneObj(S.drone).maint+swObj(S.sw).maint;
  if(id==='bat')   return droneObj(S.drone).bat;
  if(id==='stor')  return 5000;
  if(id==='fuel')  return 30000;
  return 10000;
}

/* ===== 면적계수 (소규모 전용) ===== */
function aCoefFn(id,km2){
  var b;
  if(id==='plan')               b=km2/0.25;
  else if(id==='photo')         b=Math.max(.8,.8449*km2+.7804);
  else if(id==='plane'||id==='gcp') b=Math.max(.8,1.226*km2+.6138);
  else if(id==='elev')          b=Math.max(.8,1.8737*km2+.3958);
  else if(id==='vec')           b=4*km2;
  else                          b=Math.max(.8,1.5268*km2+.561);
  return b;
}

/* ===== 외부용역 계산 ===== */
function isLarge(){return S.area>LARGE_THRESHOLD;}

function calcExt(){
  var area=S.area, gC=gsdCoef(S.gsd), tC=(TERRAIN_INFO[S.terrain]||{coef:1.0}).coef;
  var bd=[], tL=0;

  if(isLarge()){
    /* 대규모: 삼아항업 기준단가 × 면적 */
    if(S.outputs.map2d){
      var a2d=Math.round(BASE_2D*gC*tC*area);
      bd.push({n:'\uc815\uc0ac\uc601\uc0c1 \uc81c\uc791 (2D)',a:a2d,sub:false});
      tL+=a2d;
    }
    if(S.outputs.mesh3d){
      var a3d=Math.round(BASE_3D*gC*tC*area);
      bd.push({n:'3D \uba54\uc2dc \ubaa8\ub378 \uc81c\uc791',a:a3d,sub:false});
      tL+=a3d;
    }
    if(S.outputs.lidar){
      var ali=Math.round(BASE_LIDAR*tC*area);
      bd.push({n:'LiDAR \uc2a4\uce94 \ubc0f \ub370\uc774\ud130 \ucc98\ub9ac',a:ali,sub:false});
      tL+=ali;
    }
    S.ext=Math.round(tL);
    S.bd=bd;
    return;
  }

  /* 소규모: 표준품셈 공종별 계산 */
  var baseIds=['plan','recon','gcp','plane','elev','photo','tri','ortho','qc'];
  /* vec은 공종 토글에서만 제어 (결과물 선택 연동 없음) */
  for(var i=0;i<ITEMS.length;i++){
    var it=ITEMS[i];
    if(baseIds.indexOf(it.id)===-1&&it.id!=='vec') continue;
    if(!it.on) continue;
    var lab=0;
    for(var j=0;j<it.p.length;j++) lab+=(W[it.p[j][0]]||0)*it.p[j][1];
    var adj=lab*gC*tC*aCoefFn(it.id,area);
    bd.push({id:it.id,n:it.n,a:Math.round(adj),sub:false,tip:it.tip,detail:it.detail});
    tL+=adj;
  }
  if(S.outputs.mesh3d){
    var mL=363481*area*gC*tC;
    bd.push({n:'3D \uba54\uc2dc \ubaa8\ub378 \uc81c\uc791',a:Math.round(mL),sub:false});
    tL+=mL;
  }
  if(S.outputs.lidar){
    var lL=495000*area*tC;
    bd.push({n:'LiDAR \uc2a4\uce94 \ubc0f \ub370\uc774\ud130 \ucc98\ub9ac',a:Math.round(lL),sub:false});
    tL+=lL;
  }
  var ov=tL*.5, tf=(tL+ov)*.1, vat=(tL+ov+tf)*.1, tot=tL+ov+tf+vat;
  bd.push({n:'\uac04\uc811\ube44\uc6a9 (\ub178\ubb34\ube44\xd750%)',a:Math.round(ov),sub:true});
  bd.push({n:'\uae30\uc220 \uc218\uc218\ub8cc (\xd710%)',a:Math.round(tf),sub:true});
  bd.push({n:'\ubd80\uac00\uc138 (10%)',a:Math.round(vat),sub:true});
  S.ext=Math.round(tot);
  S.bd=bd;
}

function calcDir(){
  var t=0;
  for(var i=0;i<DIRECT.length;i++){
    var id=DIRECT[i].id;
    var val=S.dcosts[id]!==undefined?S.dcosts[id]:defCost(id);
    t+=(parseInt(val)||0)*(S.days||1);
  }
  return t;
}

function calcDep(){
  var t=0, dc=S.depCosts||{}, keys=['drone','lidar','ws'];
  for(var i=0;i<keys.length;i++) t+=(parseInt(dc[keys[i]])||0)*(S.days||1);
  return t;
}

/* ===== 툴팁 ===== */
var _tipOpen=null;
var _tipCnt=0;

function closeTip(){
  if(_tipOpen){
    var el=document.getElementById(_tipOpen);
    if(el) el.classList.remove('show');
    _tipOpen=null;
  }
}

function toggleTip(id){
  if(_tipOpen&&_tipOpen!==id) closeTip();
  var el=document.getElementById(id);
  if(!el) return;
  var isShow=el.classList.contains('show');
  closeTip();
  if(!isShow){el.classList.add('show');_tipOpen=id;}
}

function buildTip(text){
  var id='tp'+(++_tipCnt);
  return '<span class="tip-wrap" data-tid="'+id+'">'
    +'<span class="tip-ico">?</span>'
    +'<span class="tip-pop" id="'+id+'">'+esc(text)
    +'<br><span style="font-size:10px;opacity:.6;display:block;margin-top:6px">\ud654\uba74 \ud0ed\uc73c\ub85c \ub2eb\uae30</span></span>'
    +'</span>';
}

document.addEventListener('click',function(e){
  var tw=e.target.closest('[data-tid]');
  if(tw){e.stopPropagation();toggleTip(tw.dataset.tid);}
  else closeTip();
});

var RF=[null,r1,r2,r3,r4,r5];
var STEPS=['\uc0ac\uc5c5 \uc815\ubcf4 \uc785\ub825','\uc678\ubd80 \uc6a9\uc5ed \ub2e8\uac00','\uc9c1\uc811 \uc218\ud589 \ube44\uc6a9','\uc608\uc0b0 \uc808\uac10 \uacb0\uacfc','\ubcf4\uace0\uc11c \ubc0f \uc2e4\uc801'];

function render(){
  var s=S.step;
  var dots='';
  for(var i=1;i<=5;i++) dots+='<div class="prg-dot'+(i<s?' done':i===s?' active':'')+'"></div>';
  qs('pDots').innerHTML=dots;
  qs('sTitle').textContent=STEPS[s-1];
  qs('sCnt').textContent=s+' / 5';
  qs('bPrev').disabled=(s===1);
  qs('bNext').innerHTML=s===5?'&#10003; \uc644\ub8cc':'\ub2e4\uc74c &rarr;';
  qs('sContent').innerHTML=RF[s]();
  bindAll();
}

/* ===== 이벤트 바인딩 ===== */
function bindAll(){
  var s=S.step;
  if(s===1) bindStep1();
  if(s===2) bindStep2();
  if(s===3) bindStep3();
  if(s===5) bindStep5();
}

function bindStep1(){
  /* ── 프리셋 버튼 ── */
  var plbs=document.querySelectorAll('[data-pli]');
  for(var pi=0;pi<plbs.length;pi++){
    (function(btn){
      btn.onclick=function(e){
        if(e.target.dataset.pdi!==undefined){
          e.stopPropagation();
          delPreset(parseInt(e.target.dataset.pdi));
        } else {
          loadPreset(parseInt(btn.dataset.pli));
        }
      };
    })(plbs[pi]);
  }
  var psAdd=qs('psAddBtn');    if(psAdd)    psAdd.onclick=openPsSave;
  var psOk=qs('psOkBtn');      if(psOk)     psOk.onclick=confirmPsSave;
  var psCancel=qs('psCancelBtn'); if(psCancel) psCancel.onclick=cancelPsSave;
  var psInp=qs('psNameInp');
  if(psInp) psInp.onkeydown=function(e){if(e.key==='Enter') confirmPsSave();};

  /* ── 기존 바인딩 ── */
  var fn=qs('fn');
  if(fn) fn.oninput=function(e){S.pName=e.target.value;};

  var ai=qs('aInp');
  if(ai) ai.oninput=function(e){
    S.area=toKm2(e.target.value,S.aUnit);
    var c=qs('aConv'); if(c) c.textContent=areaConvHint(e.target.value,S.aUnit);
  };

  var ubs=document.querySelectorAll('.unit-btn');
  for(var i=0;i<ubs.length;i++){
    (function(btn){
      btn.onclick=function(){
        S.aUnit=btn.dataset.u;
        var all=document.querySelectorAll('.unit-btn');
        for(var j=0;j<all.length;j++) all[j].classList.toggle('sel',all[j].dataset.u===S.aUnit);
        var ai2=qs('aInp'); if(ai2) ai2.value=dispArea(S.aUnit);
        var ul=qs('aUnitLbl'); if(ul) ul.textContent=UNIT_LBL_MAP[S.aUnit]||'';
        var ac=qs('aConv'); if(ac) ac.textContent=areaConvHint(dispArea(S.aUnit),S.aUnit);
      };
    })(ubs[i]);
  }

  var gi=qs('gInp'); if(gi) gi.oninput=function(e){setGsd(parseFloat(e.target.value)||5);};
  var gr=qs('gRng'); if(gr) gr.oninput=function(e){setGsd(parseFloat(e.target.value)||5);};

  var tbs=document.querySelectorAll('[data-t]');
  for(var i=0;i<tbs.length;i++){
    (function(btn){
      btn.onclick=function(){
        S.terrain=TERRAINS[parseInt(btn.dataset.t)];
        var all=document.querySelectorAll('[data-t]');
        for(var j=0;j<all.length;j++) all[j].classList.toggle('sel',all[j].dataset.t===btn.dataset.t);
      };
    })(tbs[i]);
  }

  var ocs=document.querySelectorAll('[data-ok]');
  for(var i=0;i<ocs.length;i++){
    (function(el){
      el.onclick=function(){
        var k=el.dataset.ok; S.outputs[k]=!S.outputs[k];
        el.classList.toggle('sel',S.outputs[k]);
        var chk=el.querySelector('[data-ock]'); if(chk) chk.checked=S.outputs[k];
      };
    })(ocs[i]);
  }
  var ckbs=document.querySelectorAll('[data-ock]');
  for(var i=0;i<ckbs.length;i++){
    (function(chk){
      chk.onchange=function(e){
        e.stopPropagation();
        var k=chk.dataset.ock; S.outputs[k]=chk.checked;
        var card=qs('sContent').querySelector('[data-ok="'+k+'"]');
        if(card) card.classList.toggle('sel',S.outputs[k]);
      };
    })(ckbs[i]);
  }

  var dvbs=document.querySelectorAll('[data-dv]');
  for(var i=0;i<dvbs.length;i++){
    (function(btn){
      btn.onclick=function(){
        S.drone=btn.dataset.dv;
        var all=document.querySelectorAll('[data-dv]');
        for(var j=0;j<all.length;j++) all[j].classList.toggle('sel',all[j].dataset.dv===S.drone);
      };
    })(dvbs[i]);
  }

  var svbs=document.querySelectorAll('[data-sv]');
  for(var i=0;i<svbs.length;i++){
    (function(btn){
      btn.onclick=function(){
        S.sw=btn.dataset.sv;
        var all=document.querySelectorAll('[data-sv]');
        for(var j=0;j<all.length;j++) all[j].classList.toggle('sel',all[j].dataset.sv===S.sw);
      };
    })(svbs[i]);
  }
}

function bindStep2(){
  var eq=document.getElementById('extQInp');
  if(eq) eq.oninput=function(e){
    S.extQuote=parseInt(e.target.value)||0;
    var sb=document.querySelector('#sContent .sum-box');
    if(sb){
      var qDiff=S.ext-S.extQuote, qRate=S.ext>0?(qDiff/S.ext*100):0;
      if(S.extQuote>0){
        sb.innerHTML='<div class="sum-box-row"><span>표준품셈 추정액 (참고)</span><span>'+fmt(S.ext)+'</span></div>'
          +'<div class="sum-box-row"><span style="color:var(--red);font-weight:600">업체 실제 견적 (VAT포함)</span><span style="color:var(--red);font-weight:700">'+fmt(S.extQuote)+'</span></div>'
          +'<div class="sum-box-row" style="font-size:12px"><span>낙실률 (표준품셈 대비)</span><span style="color:var(--green)">'+qRate.toFixed(1)+'%</span></div>';
      }
    }
  };
  var pbs=document.querySelectorAll('[data-pid]');
  for(var i=0;i<pbs.length;i++){
    (function(btn){
      btn.onclick=function(){
        var id=btn.dataset.pid;
        for(var k=0;k<ITEMS.length;k++){
          if(ITEMS[k].id===id){ITEMS[k].on=!ITEMS[k].on;break;}
        }
        calcExt();
        btn.classList.toggle('on');
        var row=document.getElementById('pr_'+id);
        if(row) row.classList.toggle('off',!btn.classList.contains('on'));
        /* 금액 업데이트 */
        var gC=gsdCoef(S.gsd), tC=(TERRAIN_INFO[S.terrain]||{coef:1}).coef;
        for(var k=0;k<ITEMS.length;k++){
          if(ITEMS[k].id!==id) continue;
          var it2=ITEMS[k], lab=0;
          for(var j=0;j<it2.p.length;j++) lab+=(W[it2.p[j][0]]||0)*it2.p[j][1];
          var ua=Math.round(lab*gC*tC*aCoefFn(it2.id,S.area));
          var amtEl=row?row.querySelector('.proc-amt'):null;
          if(amtEl) amtEl.innerHTML=it2.on?fmt(ua):'<s style="color:var(--gray300)">'+fmt(ua)+'</s>';
        }
        /* 소계 박스 업데이트 */
        var subItems=[], mainItems=[];
        for(var k=0;k<S.bd.length;k++){if(S.bd[k].sub)subItems.push(S.bd[k]);else mainItems.push(S.bd[k]);}
        var laborSum=0; for(var k=0;k<mainItems.length;k++) laborSum+=mainItems[k].a;
        var sumBoxRows=document.querySelectorAll('.sum-box .sum-box-row');
        if(sumBoxRows.length){
          sumBoxRows[0].querySelector('span:last-child').textContent=fmt(laborSum);
          var subIdx=1;
          for(var k=0;k<subItems.length;k++){sumBoxRows[subIdx].querySelector('span:last-child').textContent=fmt(subItems[k].a);subIdx++;}
          sumBoxRows[subIdx].querySelector('span:last-child').textContent=fmt(S.ext);
        }
      };
    })(pbs[i]);
  }
}

function bindStep3(){
  var di=qs('dInp');
  if(di) di.oninput=function(e){S.days=parseInt(e.target.value)||1; var t=qs('dTtl'); if(t) t.textContent=fmt(calcDir());};

  var depIds=['drone','lidar','ws'];

    })(depIds[i]);
  }
}

function bindStep5(){

/* ===== 네비게이션 ===== */
function go(d){
  if(d>0){
    if(S.step===1&&(!S.area||S.area<=0)){toast('\uce2c\uc601 \uba74\uc801\uc744 \uc785\ub825\ud574\uc8fc\uc138\uc694'); return;}
    if(S.step<5){S.step++; render(); window.scrollTo(0,0);}
  } else {
    if(S.step>1){S.step--; render(); window.scrollTo(0,0);}
  }
}

function addHist(){
  var dir=calcDir();
  S.hist.unshift({
    nm:S.pName||'\ubb34\uc81c \uc0ac\uc5c5',
    dt:new Date().toLocaleDateString('ko-KR'),
    ar:S.area, gsd:S.gsd, tr:S.terrain,
    ext:S.ext, dir:dir, sv:S.saving, rt:S.rate

  gaEvent('calc_complete',{area:S.area,gsd:S.gsd,terrain:S.terrain,saving:S.saving,rate:Math.round(S.rate)});

}

  h+=fmt(dep)+' ('+S.days+'일 기준) — 드론 교체·추가 구매 예산 요청 근거로 활용</div>';

  /* 산출 근거 */
  h+='<div class="note">&#128204; 산출 근거: '+modeStr+' 적용';
  h+=' | GSD계수 '+gC.toFixed(2)+' × 지형계수 '+tC.toFixed(1)+' × 면적계수';
  h+=' | 직접수행 비용 = 소모품 × '+S.days+'일 | 공무원 인건비 0원 처리</div>';

  /* 연간 실적 목록 (있을 때만) */
  if(S.hist.length>0){
    var ann=0;
    for(var i=0;i<S.hist.length;i++) ann+=S.hist[i].sv;
    h+='<div class="th">연간 누적 실적 ('+S.hist.length+'건 / 총 절감 '+fmt(ann)+')</div>';
    h+='<table><thead><tr>';
    h+='<th>사업명</th><th>날짜</th><th>면적</th><th>GSD</th>';
    h+='<th class="tr">절감액</th><th class="tr">절감률</th></tr></thead><tbody>';
    for(var i=0;i<S.hist.length;i++){
      var hh=S.hist[i];
      h+='<tr><td>'+(hh.nm||'무제')+'</td>';
      h+='<td>'+hh.dt+'</td>';
      h+='<td>'+hh.ar+'km&#178;</td>';
      h+='<td>'+(hh.gsd||'-')+'cm</td>';
      h+='<td class="tr">'+fmt(hh.sv)+'</td>';
      h+='<td class="tr">'+hh.rt.toFixed(1)+'%</td></tr>';
    }
    h+='<tr class="sv-row"><td colspan="4">합계</td>';
    h+='<td class="tr">'+fmt(ann)+'</td><td></td></tr>';
    h+='</tbody></table>';
  }

  /* 푸터 */
  h+='<div class="footer">';
  h+='양주시 기업지원과 AI드론정책팀';
  h+=' &nbsp;|&nbsp; 드론 업무 예산절감 계산기 v5.0';
  h+=' &nbsp;|&nbsp; '+d;
  h+='</div>';

  h+='</body></html>';
  return h;
}

function doText(){
  var el=qs('tOut');
  if(el){el.classList.remove('hidden'); qs('tTxt').textContent=makeTxt(); el.scrollIntoView({behavior:'smooth'});}
}

function doCopy(){
  var txt=qs('tTxt'); if(!txt) return;
  if(navigator.clipboard){
    navigator.clipboard.writeText(txt.textContent).then(function(){toast('\ud074\ub9bd\ubcf4\ub4dc\uc5d0 \ubcf5\uc0ac\ub418\uc5c8\uc2b5\ub2c8\ub2e4');});
  } else {
    var r=document.createRange();
    r.selectNodeContents(txt);
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(r);
    toast('Ctrl+C \ub85c \ubcf5\uc0ac\ud574\uc8fc\uc138\uc694');
  }
}

function doCsv(){
  var dir=calcDir();
  /* \u2500\u2500 \ud604\uc7ac \uc0ac\uc5c5 \ub0b4\uc5ed \uc2dc\ud2b8 \u2500\u2500 */
  var rows=[
    ['\ud56d\ubaa9','\uae08\uc561(\uc6d0)'],
    ['\uc0ac\uc5c5\uba85',S.pName||''],
    ['\uba74\uc801(km2)',S.area],
    ['GSD(cm)',S.gsd],
    ['\uc9c0\ud615',S.terrain],
    ['\uc678\ubd80\uc6a9\uc5ed \uacac\uc801',S.ext]
  ];
  for(var i=0;i<S.bd.length;i++) rows.push([S.bd[i].n,S.bd[i].a]);
  rows.push(['\uc9c1\uc811\uc218\ud589',dir],['\uc808\uac10\uc561',S.saving],['\uc808\uac10\ub960(%)',S.rate.toFixed(1)]);
  /* \u2500\u2500 \uc5f0\uac04 \ubaa9\ub85d \uc2dc\ud2b8 (\uad6c\ubd84\uc120 \ud6c4 \ucd94\uac00) \u2500\u2500 */
  if(S.hist.length>0){
    rows.push([''],[''],
      ['\uc5f0\uac04 \uc0ac\uc5c5 \ubaa9\ub85d'],
      ['\uc0ac\uc5c5\uba85','\ub0a0\uc9dc','\uba74\uc801(km2)','GSD(cm)','\uc9c0\ud615','\uc808\uac10\uc561','\uc808\uac10\ub960(%)']
    );
    var annTot=0;
    for(var i=0;i<S.hist.length;i++){
      var hh=S.hist[i];
      rows.push([hh.nm||'',hh.dt,hh.ar,hh.gsd||'',hh.tr||'',hh.sv,hh.rt.toFixed(1)]);
      annTot+=hh.sv;
    }
    rows.push(['\ud569\uacc4','','','','',annTot,'']);
  }
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\uFEFF'+rows.map(function(r){return r.join(',');}).join('\n')],{type:'text/csv;charset=utf-8'}));
  a.download='\ub4dc\ub860\uc808\uac10_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
  toast('\uc5d1\uc140 \ud30c\uc77c\uc774 \uc800\uc7a5\ub418\uc5c8\uc2b5\ub2c8\ub2e4');
}

function doPdf(){
  gaEvent('pdf_export',{area:S.area,gsd:S.gsd,saving:S.saving});

  var w=window.open('','_blank');

    w.focus();

    toast('\ud31d\uc5c5 \ucc28\ub2e8 \ud574\uc81c \ud6c4 \ub2e4\uc2dc \uc2dc\ub3c4\ud574\uc8fc\uc138\uc694');
  }
}

/* ===== PWA (최초 1회만 등록) ===== */
var _deferredPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault(); _deferredPrompt=e;
  var bar=document.getElementById('pwaBar');
  if(bar){
    bar.style.display='block';
    document.getElementById('mainApp').style.paddingTop='40px';
    bar.onclick=function(){
      bar.style.display='none';
      if(_deferredPrompt){_deferredPrompt.prompt();}
    };
  }
});

/* ===== 터치 피드백 (최초 1회만 등록) ===== */
document.addEventListener('touchstart',function(e){
  var t=e.target;
  if(t.classList.contains('btn-n')||t.classList.contains('btn-p')||
     t.classList.contains('unit-btn')||t.classList.contains('opt-btn')||
     t.classList.contains('eq-btn')||t.classList.contains('out-card')||
     t.classList.contains('proc-toggle')||t.classList.contains('ex-btn')){
    t.style.opacity='.8';
    setTimeout(function(){t.style.opacity='';},150);
  }
},{passive:true});

/* ===== 키패드 가림 방지 (최초 1회만 등록) ===== */
document.addEventListener('focusin',function(e){
  if(e.target.tagName==='INPUT'){
    setTimeout(function(){e.target.scrollIntoView({behavior:'smooth',block:'center'});},300);
  }
});

/* ===== 시작 ===== */
loadFromUrl();
render();
</script>
